name: CI

# 17-64 S1: one full CI per commit on pull_request; push only main + tools-1758 + int-1758.
on:
  pull_request:
  push:
    branches:
      - main
      - tools-1758
      - int-1758
  workflow_dispatch:
    inputs:
      job:
        description: "Manual job (H4 smoke / W4 inline-cmp / default all CI)"
        required: true
        default: "ci"
        type: choice
        options:
          - ci
          - h4-smoke
          - w4-inline-cmp

# 17-64／17-67 S2: one concurrency group per head branch so push+PR cancel each other.
# github.ref differs (refs/heads/X vs refs/pull/N/merge) — use head_ref || ref_name.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_BIN: Godot_v4.7.2-stable_linux.x86_64

jobs:
  # 17-64 S4: parallel gut-unit / gut-ui / golden; unit matrix 4-way when wall >10m.
  gut-unit:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'ci'
    runs-on: ubuntu-latest
    # 17-67／R9-73 wall raised to 45 (do not raise further — D-130／E3(e)).
    # E3(e)：file-weight + property round-robin; wp26 not alone with all property.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot 4.7.2-stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x "${GODOT_BIN}"
          mv "${GODOT_BIN}" godot
          ./godot --version

      - name: Ensure godot executable
        run: |
          set -euo pipefail
          chmod +x godot
          ./godot --version

      - name: tools/*.ps1 must be pure ASCII
        if: matrix.shard == 0
        run: |
          set -euo pipefail
          fail=0
          shopt -s nullglob
          for f in tools/*.ps1; do
            if LC_ALL=C grep -n '[^[:print:][:space:]]' "$f" >/tmp/ps1_nonascii.txt; then
              echo "::error::non-ASCII bytes in $f"
              cat /tmp/ps1_nonascii.txt
              fail=1
            fi
            if python3 -c "import sys; b=open(sys.argv[1],'rb').read(); sys.exit(0 if all(x<128 for x in b) else 1)" "$f"; then
              echo "ASCII_OK $f"
            else
              echo "::error::byte>127 in $f"
              python3 -c "b=open('$f','rb').read(); print([(i,b[i]) for i in range(len(b)) if b[i]>127][:20])"
              fail=1
            fi
          done
          exit "$fail"

      # 17-64 S3: cache .godot/imported (never test/golden outputs).
      - name: Cache Godot imported assets
        uses: actions/cache@v5
        with:
          path: .godot/imported
          key: godot-imported-${{ hashFiles('project.godot', '**/*.import', 'data/**') }}
          restore-keys: |
            godot-imported-

      - name: Import project (register global classes)
        run: |
          set -euo pipefail
          ./godot --headless --path . --import

      # 17-64 T1: Godot 4.7.2 gut .import must leave a clean tree.
      # Ignore download artifacts (godot.zip / godot binary) left in the workspace.
      - name: Assert import leaves clean tree
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain | awk '!($1=="??" && ($2=="godot" || $2=="godot.zip"))' || true)"
          if [[ -n "${dirty}" ]]; then
            echo "::error::godot --import dirtied the working tree (commit missing .import / .uid)"
            echo "$dirty"
            git diff --stat
            exit 1
          fi
          echo "IMPORT_CLEAN_TREE_OK"

      # D-130／E3(e)：測檔權重（property 先 round-robin，再 unit 按 size greedy）；
      # boot-heavy unit（wp26_a/b、wp27）視同 property round-robin，a/b 不同片；timeout 仍 45。
      - name: Select unit+property shard scripts (file-weight balanced 4-way)
        id: shard
        run: |
          set -euo pipefail
          SHARD="${{ matrix.shard }}"
          python3 - <<PY
          from pathlib import Path

          PROP_MULT = 80  # property wall ≫ unit per byte (runtime proxy)
          BOOT_HEAVY = {
              "test_sys23_wp26_a.gd",
              "test_sys23_wp26_b.gd",
              "test_sys23_wp27.gd",
          }
          shard = int("${SHARD}")
          props = sorted(
              Path("tests/property").glob("test_*.gd"),
              key=lambda p: (-p.stat().st_size, p.name),
          )
          units_all = sorted(
              Path("tests/unit").glob("test_*.gd"),
              key=lambda p: (-p.stat().st_size, p.name),
          )
          boot = [p for p in units_all if p.name in BOOT_HEAVY]
          units = [p for p in units_all if p.name not in BOOT_HEAVY]
          bins = [[] for _ in range(4)]
          loads = [0] * 4
          # Property first, round-robin heaviest→lightest (spread; ≤2 props/shard).
          for idx, f in enumerate(props):
              i = idx % 4
              bins[i].append(f)
              loads[i] += f.stat().st_size * PROP_MULT
          # Boot-heavy units: same PROP_MULT + round-robin so wp26_a/b never share a shard.
          for idx, f in enumerate(boot):
              i = idx % 4
              bins[i].append(f)
              loads[i] += f.stat().st_size * PROP_MULT
          # Remaining units by file size → lightest bin.
          for f in units:
              i = min(range(4), key=lambda k: loads[k])
              bins[i].append(f)
              loads[i] += f.stat().st_size
          selected = bins[shard]
          out = Path("/tmp/gut_shard_tests.txt")
          lines = [f"res://{p.as_posix()}" for p in sorted(selected, key=lambda p: p.name)]
          out.write_text("\n".join(lines) + "\n")
          wp26 = any(p.name.startswith("test_sys23_wp26") for p in selected)
          n_prop = sum(1 for p in selected if p.parent.name == "property")
          print(
              f"SHARD={shard} scripts={len(selected)} file_weight={loads[shard]} "
              f"wp26={int(wp26)} property={n_prop} balance=file_weight_prop_rr"
          )
          for ln in lines:
              print(ln)
          Path("/tmp/gut_shard_selected_unit.txt").write_text(str(len(selected)))
          PY
          echo "selected_unit=$(cat /tmp/gut_shard_selected_unit.txt)" >> "$GITHUB_OUTPUT"

      - name: Run GUT unit shard
        run: |
          set -euo pipefail
          # GUT -gtest takes full res:// paths (keeps original script locations).
          mapfile -t TESTS < /tmp/gut_shard_tests.txt
          if [[ ${#TESTS[@]} -eq 0 ]]; then
            echo "::error::shard selected zero scripts"
            exit 1
          fi
          GTEST_ARGS=()
          for t in "${TESTS[@]}"; do
            GTEST_ARGS+=("-gtest=${t}")
          done
          ./godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gconfig= \
            "${GTEST_ARGS[@]}" \
            -gexit 2>&1 | tee gut_unit.log
          if grep -F "SCRIPT ERROR" gut_unit.log; then
            echo "::error::SCRIPT ERROR detected in GUT unit/property log (ci-script-error-gate)"
            exit 1
          fi
          grep -E 'Passing Tests|Failing|All tests passed' gut_unit.log | tail -20 || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path("gut_unit.log").read_text(errors="replace")
          m = re.findall(r"Passing Tests\s+(\d+)", text)
          n = int(m[-1]) if m else -1
          Path("gut_unit_passing.txt").write_text(f"{n}\n")
          print(f"SHARD_PASSING={n}")
          # Bare test names for 17-69 2.4 set-diff gate (unique across suite).
          # Strip ANSI — GUT prefixes the first test of each script with \x1b[0m
          # so ^\* alone under-counts and falsely lists REMOVED_NAMES.
          clean = re.sub(r"\x1b\[[0-9;]*m", "", text)
          names = sorted(set(re.findall(r"^\* (test_\w+)$", clean, flags=re.M)))
          Path("gut_unit_names.txt").write_text("\n".join(names) + ("\n" if names else ""))
          print(f"SHARD_NAMES={len(names)}")
          if n >= 0 and len(names) != n:
              print(f"::warning::SHARD_NAMES={len(names)} != SHARD_PASSING={n} (name parse drift)")
          PY
      - name: A35 norm scan (report-only, shard 0)
        if: matrix.shard == 0
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/a35_norm_scan.py

      - name: Upload GUT unit shard logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gut-unit-logs-${{ matrix.shard }}
          path: |
            gut_unit.log
            gut_unit_passing.txt
            gut_unit_names.txt
          retention-days: 3

  # 17-69 2.4／Owner 追認(乙): ≥ baseline + name set-diff; print ADDED/REMOVED (or 無).
  # Removing a baseline name requires Owner pre-approval; never same commit as product.
  gut-unit-gate:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'ci'
    needs: gut-unit
    runs-on: ubuntu-latest
    # 17-69 2.3: only job previously missing a wall-clock cap.
    timeout-minutes: 5
    steps:
      - name: Checkout (baseline name list)
        uses: actions/checkout@v5

      - name: Download shard passing counts
        uses: actions/download-artifact@v5
        with:
          pattern: gut-unit-logs-*
          merge-multiple: false
          path: shard_logs

      - name: Verify Passing ≥ baseline; print ADDED_NAMES / REMOVED_NAMES
        run: |
          set -euo pipefail
          echo "Shard artifacts:"
          find shard_logs -type f -print
          total=0
          while IFS= read -r f; do
            n=$(tr -d '[:space:]' < "$f")
            echo "file=$f passing=$n"
            total=$((total + n))
          done < <(find shard_logs -name gut_unit_passing.txt | sort)
          echo "TOTAL_PASSING=${total}"
          BASELINE_FILE=".github/ci/gut_unit_property_baseline_names.txt"
          BASELINE_COUNT=$(grep -c . "$BASELINE_FILE" || true)
          echo "BASELINE_COUNT=${BASELINE_COUNT}"
          if [[ "$total" -lt "$BASELINE_COUNT" ]]; then
            echo "::error::unit+property Passing=${total} < baseline ${BASELINE_COUNT}"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          baseline = {
              ln.strip()
              for ln in Path(".github/ci/gut_unit_property_baseline_names.txt").read_text().splitlines()
              if ln.strip()
          }
          seen = set()
          for f in Path("shard_logs").rglob("gut_unit_names.txt"):
              for ln in f.read_text(errors="replace").splitlines():
                  n = ln.strip()
                  if n:
                      seen.add(n)
          removed = sorted(baseline - seen)
          added = sorted(seen - baseline)
          print(f"SEEN_NAMES={len(seen)} BASELINE_NAMES={len(baseline)}")
          print("REMOVED_NAMES:")
          if removed:
              for n in removed:
                  print(n)
          else:
              print("無")
          print("ADDED_NAMES:")
          if added:
              for n in added:
                  print(n)
          else:
              print("無")
          if removed:
              print("::error::REMOVED_NAMES non-empty — baseline test deleted/renamed without Owner pre-approval (set diff)")
              raise SystemExit(1)
          print("GUT_UNIT_PROPERTY_BASELINE_NAMES_OK=1")
          PY
          echo "GUT_UNIT_PROPERTY_COUNT_OK>=${BASELINE_COUNT} actual=${total}"

  gut-ui:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'ci'
    runs-on: ubuntu-latest
    # 17-69 2.2: restore 15 (measured ~2m09s); whole-CI ≤50m is not a per-job raise.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot 4.7.2-stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x "${GODOT_BIN}"
          mv "${GODOT_BIN}" godot
          ./godot --version

      - name: Ensure godot executable
        run: |
          set -euo pipefail
          chmod +x godot
          ./godot --version

      - name: Cache Godot imported assets
        uses: actions/cache@v5
        with:
          path: .godot/imported
          key: godot-imported-${{ hashFiles('project.godot', '**/*.import', 'data/**') }}
          restore-keys: |
            godot-imported-

      - name: Import project (register global classes)
        run: |
          set -euo pipefail
          ./godot --headless --path . --import

      - name: Assert import leaves clean tree
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain | awk '!($1=="??" && ($2=="godot" || $2=="godot.zip"))' || true)"
          if [[ -n "${dirty}" ]]; then
            echo "::error::godot --import dirtied the working tree"
            echo "$dirty"
            exit 1
          fi
          echo "IMPORT_CLEAN_TREE_OK"

      - name: Run GUT UI tests
        run: |
          set -euo pipefail
          ./godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/ui \
            -gexit 2>&1 | tee gut_ui.log
          if grep -F "SCRIPT ERROR" gut_ui.log; then
            echo "::error::SCRIPT ERROR detected in GUT UI log (ci-script-error-gate)"
            exit 1
          fi
          grep -E 'Tests:|Passing:|Failing:' gut_ui.log | tail -20 || true

      - name: Upload GUT UI logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: gut-ui-logs
          path: gut_ui.log
          retention-days: 3

  # 17-78 CI-SPLIT: PR-only compare (required check). Fail with GOLDEN_NOT_COMPARED=1
  # when baseline missing / download fail / dims mismatch — never silent exit 0.
  golden-30d-compare:
    # 17-62 P6b: skip golden on fork PRs. 17-64 S5: PRs compare to main artifact.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    # 17-69 2.2: restore 15 (measured ~1m14s).
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot 4.7.2-stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x "${GODOT_BIN}"
          mv "${GODOT_BIN}" godot
          ./godot --version

      - name: Ensure godot executable
        run: |
          set -euo pipefail
          chmod +x godot
          ./godot --version

      - name: Cache Godot imported assets
        uses: actions/cache@v5
        with:
          path: .godot/imported
          key: godot-imported-${{ hashFiles('project.godot', '**/*.import', 'data/**') }}
          restore-keys: |
            godot-imported-

      - name: Import project
        run: |
          set -euo pipefail
          ./godot --headless --path . --import

      - name: Assert import leaves clean tree
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain | awk '!($1=="??" && ($2=="godot" || $2=="godot.zip"))' || true)"
          if [[ -n "${dirty}" ]]; then
            echo "::error::godot --import dirtied the working tree"
            echo "$dirty"
            exit 1
          fi
          echo "IMPORT_CLEAN_TREE_OK"

      - name: 30d golden gated
        run: |
          set -euo pipefail
          mkdir -p out/golden
          tools/run_golden_gated.sh --godot ./godot --out "$(pwd)/out/golden/30d.csv" --days 30 --seed 1 \
            --log "$(pwd)/out/golden/30d.log"
          echo "GOLDEN_30D_DONE"
          wc -l out/golden/30d.csv
          # Cell summary for evening-17-64 gate (row count + sha256).
          sha256sum out/golden/30d.csv | tee out/golden/30d.sha256
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p = Path("out/golden/30d.csv")
          rows = list(csv.DictReader(p.open(newline="", encoding="utf-8")))
          cols = list(rows[0].keys()) if rows else []
          print(f"GOLDEN_SUMMARY rows={len(rows)} cols={len(cols)} bytes={p.stat().st_size}")
          PY

      - name: Download latest main golden baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/golden-main
          # 17-69 W1(d)／E6(N-15)：只取 main 分支最新未過期 golden-30d artifact。
          # 無 artifact 或下載失敗 → GOLDEN_NOT_COMPARED=1 + exit 1；不得靜默 exit 0。
          set +e
          # 17-78 V3 probe (temporary): force missing baseline → GOLDEN_NOT_COMPARED=1.
          ART_META=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=golden-30d-V3-FORCE-MISSING&per_page=100" \
            --jq '[.artifacts[] | select(.expired==false and .workflow_run.head_branch=="main")] | .[0] // empty')
          set -e
          RUN_ID=""
          ART_ID=""
          if [[ -n "${ART_META}" && "${ART_META}" != "null" ]]; then
            RUN_ID=$(echo "${ART_META}" | jq -r '.workflow_run.id // empty')
            ART_ID=$(echo "${ART_META}" | jq -r '.id // empty')
          fi
          if [[ -z "${RUN_ID}" ]]; then
            echo "missing" > out/golden-main/STATUS.txt
            echo "GOLDEN_NOT_COMPARED=1"
            echo "::error::GOLDEN_BASE_MISSING — no non-expired main golden-30d artifact (E6/N-15; S9b; no bootstrap)"
            exit 1
          fi
          echo "GOLDEN_BASE_RUN_ID=${RUN_ID}"
          echo "GOLDEN_BASE_ARTIFACT_ID=${ART_ID}"
          set +e
          gh run download "${RUN_ID}" --repo "${{ github.repository }}" -n golden-30d -D out/golden-main
          RC=$?
          set -e
          if [[ $RC -ne 0 ]] || [[ ! -f out/golden-main/30d.csv ]]; then
            echo "missing" > out/golden-main/STATUS.txt
            echo "GOLDEN_NOT_COMPARED=1"
            echo "::error::GOLDEN_BASE_DOWNLOAD_FAIL run=${RUN_ID} rc=${RC} (E6/N-15; S9b; no bootstrap)"
            exit 1
          fi
          echo "present" > out/golden-main/STATUS.txt
          echo "GOLDEN_BOOTSTRAP=0"
          ls -la out/golden-main/

      - name: Compare PR golden to main baseline
        run: |
          set -euo pipefail
          if [[ ! -f out/golden-main/30d.csv ]]; then
            echo "GOLDEN_NOT_COMPARED=1"
            echo "::error::GOLDEN_BASE_MISSING — out/golden-main/30d.csv absent after download step (S9b)"
            exit 1
          fi
          STATUS="$(cat out/golden-main/STATUS.txt 2>/dev/null || echo unknown)"
          if [[ "${STATUS}" == "bootstrap" ]]; then
            echo "GOLDEN_BOOTSTRAP=1"
          else
            echo "GOLDEN_BOOTSTRAP=0"
          fi
          set +e
          python3 tools/golden_compare.py out/golden-main/30d.csv out/golden/30d.csv | tee out/golden-main/compare.out
          RC=${PIPESTATUS[0]}
          set -e
          # 17-70 T4／N-13 + D-130 甲(2)：兩邊列數、欄數必須相等；COMPARED_CELLS＝列×欄且＞0。
          # COMPARED_* 以 CSV 網格為準（不依賴 compare.out 是否印 COMPARED_*）。
          eval "$(python3 - <<'PY'
          import csv
          from pathlib import Path

          def grid(path):
              rows = list(csv.DictReader(Path(path).open(newline="", encoding="utf-8")))
              if not rows:
                  return 0, 0
              return len(rows), len(list(rows[0].keys()))

          ra, ca = grid("out/golden-main/30d.csv")
          rb, cb = grid("out/golden/30d.csv")
          dims_ok = ra == rb and ca == cb and ra > 0 and ca > 0
          rows = ra if dims_ok else 0
          cols = ca if dims_ok else 0
          cells = rows * cols
          text = Path("out/golden-main/compare.out").read_text(encoding="utf-8", errors="replace")
          diff = 0
          if "IDENTICAL=1" in text:
              diff = 0
          else:
              for line in text.splitlines():
                  if "diff_cells=" in line:
                      try:
                          diff += int(line.rsplit("diff_cells=", 1)[1].strip())
                      except ValueError:
                          pass
          print(f"COMPARED_ROWS={rows}")
          print(f"COMPARED_COLS={cols}")
          print(f"COMPARED_CELLS={cells}")
          print(f"DIFF_CELLS={diff}")
          print(f"CSV_ROWS_A={ra}")
          print(f"CSV_ROWS_B={rb}")
          print(f"CSV_COLS_A={ca}")
          print(f"CSV_COLS_B={cb}")
          print(f"DIMS_EQUAL={1 if dims_ok else 0}")
          PY
          )"
          echo "COMPARED_ROWS=${COMPARED_ROWS}"
          echo "COMPARED_COLS=${COMPARED_COLS}"
          echo "COMPARED_CELLS=${COMPARED_CELLS}"
          echo "DIFF_CELLS=${DIFF_CELLS}"
          echo "CSV_ROWS_A=${CSV_ROWS_A} CSV_ROWS_B=${CSV_ROWS_B} CSV_COLS_A=${CSV_COLS_A} CSV_COLS_B=${CSV_COLS_B}"
          echo "DIMS_EQUAL=${DIMS_EQUAL}"
          if [[ "${DIMS_EQUAL}" != "1" ]]; then
            echo "GOLDEN_NOT_COMPARED=1"
            echo "::error::GOLDEN_DIMS_MISMATCH rows_a=${CSV_ROWS_A} rows_b=${CSV_ROWS_B} cols_a=${CSV_COLS_A} cols_b=${CSV_COLS_B} (D-130; S9b)"
            exit 1
          fi
          expect=$((COMPARED_ROWS * COMPARED_COLS))
          if [[ "${COMPARED_CELLS}" -eq 0 ]] || [[ "${COMPARED_CELLS}" -ne "${expect}" ]]; then
            echo "GOLDEN_NOT_COMPARED=1"
            echo "::error::COMPARED_CELLS_INVALID cells=${COMPARED_CELLS} expect_rows_x_cols=${expect} (N-13/D-130; S9b)"
            exit 1
          fi
          if [[ $RC -ne 0 ]]; then
            exit "$RC"
          fi
          echo "GOLDEN_CELLS_IDENTICAL=1"

      - name: Upload golden artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: golden-30d
          path: out/golden/
          retention-days: 14

  # 17-78 CI-SPLIT: main-push baseline only (upload). No download/compare/diff judge.
  # Not a merge required check — only golden-30d-compare counts toward merge.
  golden-30d-baseline:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot 4.7.2-stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x "${GODOT_BIN}"
          mv "${GODOT_BIN}" godot
          ./godot --version

      - name: Ensure godot executable
        run: |
          set -euo pipefail
          chmod +x godot
          ./godot --version

      - name: Cache Godot imported assets
        uses: actions/cache@v5
        with:
          path: .godot/imported
          key: godot-imported-${{ hashFiles('project.godot', '**/*.import', 'data/**') }}
          restore-keys: |
            godot-imported-

      - name: Import project
        run: |
          set -euo pipefail
          ./godot --headless --path . --import

      - name: Assert import leaves clean tree
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain | awk '!($1=="??" && ($2=="godot" || $2=="godot.zip"))' || true)"
          if [[ -n "${dirty}" ]]; then
            echo "::error::godot --import dirtied the working tree"
            echo "$dirty"
            exit 1
          fi
          echo "IMPORT_CLEAN_TREE_OK"

      - name: 30d golden gated
        run: |
          set -euo pipefail
          mkdir -p out/golden
          tools/run_golden_gated.sh --godot ./godot --out "$(pwd)/out/golden/30d.csv" --days 30 --seed 1 \
            --log "$(pwd)/out/golden/30d.log"
          echo "GOLDEN_30D_DONE"
          wc -l out/golden/30d.csv
          sha256sum out/golden/30d.csv | tee out/golden/30d.sha256
          python3 - <<'PY'
          import csv
          from pathlib import Path
          p = Path("out/golden/30d.csv")
          rows = list(csv.DictReader(p.open(newline="", encoding="utf-8")))
          cols = list(rows[0].keys()) if rows else []
          print(f"GOLDEN_SUMMARY rows={len(rows)} cols={len(cols)} bytes={p.stat().st_size}")
          PY

      - name: Upload golden artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: golden-30d
          path: out/golden/
          retention-days: 14

  # 17-64 S6 / 17-59 H4: only push tools-1758/int-1758 (or manual), not general PRs.
  m1b-h4-smoke:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/tools-1758' || github.ref == 'refs/heads/int-1758'))
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'h4-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot 4.7.2-stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x "${GODOT_BIN}"
          mv "${GODOT_BIN}" godot

      - name: Ensure godot executable
        run: chmod +x godot && ./godot --version

      - name: Import project
        run: ./godot --headless --path . --import

      - name: H4 smoke Za_G0_A0 + Zb_G0_notrader (30d inline)
        run: |
          set -euo pipefail
          mkdir -p out/m1b_smoke/_scenarios
          for g in Za_G0_A0 Zb_G0_notrader; do
            python3 tools/m1b_prepare_scenario.py --group "$g" --out "out/m1b_smoke/_scenarios/${g}.json"
            mkdir -p "out/m1b_smoke/${g}"
            export M1B_GROUP_NAME="$g" M1B_GROUP_I=1 M1B_GROUP_N=2
            ./godot --headless --path . -s res://sim/sim_runner.gd -- \
              --scenario "$(pwd)/out/m1b_smoke/_scenarios/${g}.json" \
              --inline --season-progress --days 30 \
              --out-dir "$(pwd)/out/m1b_smoke/${g}" \
              2>&1 | tee "out/m1b_smoke/${g}/sim_runner.log"
            test -f "out/m1b_smoke/${g}/summary.csv"
            test -f "out/m1b_smoke/${g}/trader_summary.csv"
          done
          grep -h "PROGRESS pct=" out/m1b_smoke/*/sim_runner.log > out/m1b_smoke/progress.log || true
          ./godot --headless --path . -s res://tools/run_m1b_report.gd -- --in out/m1b_smoke
          echo "H4_SMOKE_DONE"
          test -s out/m1b_smoke/progress.log

      - name: Upload H4 smoke artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1b-h4-smoke
          path: out/m1b_smoke/
          retention-days: 3

  # 17-64 S6 / 17-60 W4: only push tools-1758/int-1758 (or manual).
  m1b-w4-inline-cmp:
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/tools-1758' || github.ref == 'refs/heads/int-1758'))
      || (github.event_name == 'workflow_dispatch' && inputs.job == 'w4-inline-cmp')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v5
        with:
          path: godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot 4.7.2-stable
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          unzip -q godot.zip
          rm -f godot.zip
          chmod +x "${GODOT_BIN}"
          mv "${GODOT_BIN}" godot

      - name: Ensure godot executable
        run: chmod +x godot && ./godot --version

      - name: Import project
        run: ./godot --headless --path . --import

      - name: W4 30d subprocess vs --inline CSV cmp
        run: |
          set -euo pipefail
          mkdir -p out/w4_cmp/_scenarios out/w4_cmp/sub out/w4_cmp/inline
          python3 tools/m1b_prepare_scenario.py --group Za_G0_A0 --out out/w4_cmp/_scenarios/Za_G0_A0.json
          SCEN="$(pwd)/out/w4_cmp/_scenarios/Za_G0_A0.json"
          ./godot --headless --path . -s res://sim/sim_runner.gd -- \
            --scenario "$SCEN" --days 30 --out-dir "$(pwd)/out/w4_cmp/sub" \
            2>&1 | tee out/w4_cmp/sub.log
          ./godot --headless --path . -s res://sim/sim_runner.gd -- \
            --scenario "$SCEN" --days 30 --inline --out-dir "$(pwd)/out/w4_cmp/inline" \
            2>&1 | tee out/w4_cmp/inline.log
          python3 - <<'PY'
          from pathlib import Path
          import sys
          root = Path("out/w4_cmp")
          ok = True
          for name in ["summary.csv", "season_cells.csv", "season_ports.csv", "combos.csv", "trader_summary.csv"]:
              a = (root / "sub" / name).read_bytes()
              b = (root / "inline" / name).read_bytes()
              if name == "summary.csv":
                  def strip(b):
                      lines = b.decode().splitlines()
                      out = [lines[0]]
                      for ln in lines[1:]:
                          parts = ln.split(",")
                          out.append(",".join(parts[:-1]) if parts else ln)
                      return "\n".join(out).encode()
                  a, b = strip(a), strip(b)
              same = a == b
              print(f"CMP {name} equal={same} bytes_a={len(a)} bytes_b={len(b)}")
              ok = ok and same
          if not ok:
              sys.exit(1)
          print("W4_INLINE_CMP_PASS")
          PY

      - name: Upload W4 cmp artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: m1b-w4-inline-cmp
          path: out/w4_cmp/
          retention-days: 3
