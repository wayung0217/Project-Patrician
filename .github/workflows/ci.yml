name: CI

on:
  push:
  pull_request:

jobs:
  gut-unit-property:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2-stable
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          ./godot --version

      - name: Import project (register global classes)
        run: |
          set -euo pipefail
          ./godot --headless --path . --import

      - name: Run GUT unit + property tests
        run: |
          set -euo pipefail
          ./godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit,res://tests/property \
            -gexit

      - name: A35 norm scan (report-only)
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/a35_norm_scan.py

  gut-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2-stable
        run: |
          set -euo pipefail
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          ./godot --version

      - name: Import project (register global classes)
        run: |
          set -euo pipefail
          ./godot --headless --path . --import

      - name: Run GUT UI tests (isolated from unit data wipe)
        run: |
          set -euo pipefail
          ./godot --headless --path . -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/ui \
            -gexit
